apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: support-center
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.app.port }}"
            # Traffic arrives through the ingress, so the visitor's address is in X-Forwarded-For.
            - name: TRUST_PROXY
              value: "1"
            - name: DATA_DIR
              value: {{ .Values.app.dataDir | quote }}
          ports:
            - containerPort: {{ .Values.app.port }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.app.dataDir | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        {{ if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" .Release.Name) .Values.persistence.existingClaim }}
        {{ else }}
        - name: data
          emptyDir: {}
        {{ end }}